<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Bearing Insights</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --line:#e3e7ec;
  --ink:#172033; --ink-2:#4a5568; --muted:#7a8496;
  --accent:#3b5bdb; --accent-soft:#e3e9ff; --accent-2:#91a7ff;
  --good:#1f8a4c; --good-soft:#e2f4ea; --warn:#b26a00; --warn-soft:#fdf1dc; --bad:#c0392b; --bad-soft:#fbe5e2;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1420; --surface:#171d2b; --surface-2:#1e2536; --line:#2a3246;
    --ink:#e8ecf4; --ink-2:#b4bdcf; --muted:#8490a6;
    --accent:#7c93ff; --accent-soft:#252f52; --accent-2:#4c63c9;
    --good:#4cc47f; --good-soft:#173326; --warn:#f0a93a; --warn-soft:#3a2c12; --bad:#ff7b6b; --bad-soft:#3b1d1a;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px} h3{font-size:13px;color:var(--ink-2)}
small,.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:auto}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);cursor:pointer}
main{padding:20px 0 60px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.section-title{margin:28px 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .k{color:var(--muted);font-size:12px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2)}
.insights{display:grid;gap:8px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ins .ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.ins.good .ic{background:var(--good-soft);color:var(--good)} .ins.warn .ic{background:var(--warn-soft);color:var(--warn)}
.ins.bad .ic{background:var(--bad-soft);color:var(--bad)} .ins.info .ic{background:var(--accent-soft);color:var(--accent)}
/* barres horizontales */
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(110px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar .track{height:14px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar .val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:64px;text-align:right}
.bar .val small{font-weight:400}
.bar:hover .fill{background:var(--accent-2)}
.funnel .bar{grid-template-columns:minmax(150px,34%) 1fr auto}
.drop{font-size:11px;color:var(--bad);font-weight:600;margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer} tr.row:hover td{background:var(--surface-2)}
tr.row.sel td{background:var(--accent-soft)}
.tbl-wrap{overflow-x:auto}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;margin:1px 2px 1px 0;white-space:nowrap}
.b-good{background:var(--good-soft);color:var(--good)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)} .b-info{background:var(--accent-soft);color:var(--accent)}
.b-mute{background:var(--surface-2);color:var(--muted)}
.score{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.score i{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.score i b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
/* parcours */
.journey{display:grid;grid-template-columns:320px 1fr;gap:14px}
@media (max-width:900px){.journey{grid-template-columns:1fr}.g-2{grid-template-columns:1fr}}
.sess-list{display:grid;gap:6px;max-height:640px;overflow:auto}
.sess{border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;background:var(--surface)}
.sess:hover{border-color:var(--accent)} .sess.sel{border-color:var(--accent);background:var(--accent-soft)}
.sess .t{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.timeline{position:relative;margin-top:6px}
.tl-item{display:grid;grid-template-columns:64px 18px 1fr;gap:8px;align-items:start;padding:3px 0}
.tl-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;text-align:right;padding-top:1px}
.tl-dot{width:10px;height:10px;border-radius:50%;margin:5px auto 0;background:var(--line)}
.tl-item.k-key .tl-dot{background:var(--accent)} .tl-item.k-good .tl-dot{background:var(--good)}
.tl-item.k-bad .tl-dot{background:var(--bad)} .tl-item.k-warn .tl-dot{background:var(--warn)}
.tl-body{font-size:13px}
.tl-body small{margin-left:6px}
.tl-page{margin:10px 0 4px 90px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:1px dashed var(--line);padding-top:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kv div{background:var(--surface-2);border-radius:9px;padding:8px 10px}
.kv b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kv span{font-size:11px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.gate{max-width:420px;margin:12vh auto;padding:0 16px}
.gate .card{padding:24px}
.gate input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin:12px 0}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;max-width:280px;opacity:0;transition:opacity .08s}
.err{color:var(--bad);margin-top:8px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<style>
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger:not([disabled]){border-color:var(--bad);color:var(--bad)}
td.cb,th.cb{width:28px;padding-right:0}
td.cb input,th.cb input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
tr.excluded td{opacity:.55}
.lang button{min-width:38px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
</style>
<div id="tip" role="tooltip"></div>
<div id="toast" class="toast" role="status"></div>

<div id="gate" class="gate" hidden>

    <div id="gateErr" class="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top"><div class="wrap">

      </div>
      <button class="btn" id="refresh" data-i18n="refresh"></button>

  <main class="wrap">

    <div class="section-title" data-i18n="s.insights"></div>
    <div class="card"><div class="insights" id="insights"></div>
      <div class="note" data-i18n="insights.note"></div></div>

    <div class="section-title" data-i18n="s.funnel"></div>

    <div class="section-title" data-i18n="s.attention"></div>
    <div class="grid g-2">
      <div class="card"><div class="card-h"><h2 data-i18n="landingTime.title"></h2><small data-i18n="avgReach"></small></div><div class="bars" id="landingTime"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="dashTime.title"></h2><small data-i18n="avgReach"></small></div><div class="bars" id="dashTime"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="tour.title"></h2><small data-i18n="tour.sub"></small></div><div class="bars" id="tour"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="scroll.title"></h2><small data-i18n="pctSessions"></small></div><div class="bars" id="scroll"></div></div>
    </div>

    <div class="section-title" data-i18n="s.interactions"></div>
    <div class="grid g-2">
      <div class="card"><div class="card-h"><h2 data-i18n="clicks.title"></h2><small data-i18n="clicks.sub"></small></div><div class="tbl-wrap"><table id="clicks"></table></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="friction.title"></h2><small data-i18n="friction.sub"></small></div><div class="tbl-wrap"><table id="friction"></table></div></div>
    </div>

    <div class="section-title" data-i18n="s.form"></div>
    <div class="grid g-3">
      <div class="card"><div class="card-h"><h2 data-i18n="cta.title"></h2></div><div class="bars" id="ctaSrc"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="roles.title"></h2></div><div class="bars" id="roles"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="raises.title"></h2></div><div class="bars" id="raises"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="fields.title"></h2><small data-i18n="fields.sub"></small></div><div class="bars" id="fields"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="devices.title"></h2></div><div class="bars" id="devices"></div></div>
      <div class="card"><div class="card-h"><h2 data-i18n="refs.title"></h2></div><div class="bars" id="refs"></div></div>
    </div>

    <div class="section-title" data-i18n="s.people"></div>
    <div class="card"><div class="card-h"><h2 data-i18n="people.title"></h2><small data-i18n="people.sub"></small></div>
      <div class="toolbar"><button class="btn danger" id="excludeSel" disabled></button><small class="muted" data-i18n="people.excludeHint"></small></div>
      <div class="tbl-wrap"><table id="people"></table></div>
      <div class="note" data-i18n="people.scoreNote"></div>
    </div>

    <div class="card" style="margin-top:14px"><div class="card-h"><h2 data-i18n="excl.title"></h2><small data-i18n="excl.sub"></small></div>
      <div class="toolbar"><button class="btn" id="includeSel" disabled></button></div>
      <div class="tbl-wrap"><table id="excluded"></table></div>
    </div>

    <div class="section-title" id="journeyAnchor" data-i18n="s.journey"></div>
    <div class="card" id="journeyCard"></div>
  </main>
</div>

  let LANG = (() => { try { return localStorage.getItem('insights_lang'); } catch (_) { return null; } })() || 'en';
  if (!I18N[LANG]) LANG = 'en';
  const fill = (s, a) => String(s).replace(/\{(\d)\}/g, (_, i) => a[i] ?? '');
  const get = path => path.split('.').reduce((o, k) => (o == null ? o : o[k]), I18N[LANG]) ?? I18N[LANG][path];
  const T = (key, ...a) => { const v = I18N[LANG][key] !== undefined ? I18N[LANG][key] : get(key); return v == null ? key : fill(v, a); };
  const locale = () => (LANG === 'fr' ? 'fr-FR' : 'en-GB');
  const pc = v => LANG === 'fr' ? v + ' %' : v + '%';

  function applyStatic() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
    document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  }

  // ---------- Libellés ----------
  const area = a => a == null ? '—' : (/^step_(\d)/.test(a) ? T('area.step', a.slice(5)) : (get('area')[a] || a));
  const cleanTarget = t => /^dataConsent/.test(t || '') ? T('consentBox', T(/unchecked/.test(t) ? 'unchecked' : 'checked')) : (t || '').replace(/^[a-zA-Z]+ · /, '');

  // ---------- Utilitaires ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
  const fmtDur = ms => {
    if (ms == null || isNaN(ms)) return '—';
    const s = Math.round(ms / 1000);
    if (s < 60) return s + ' s';
    const m = Math.floor(s / 60), r = s % 60;
    if (m < 60) return m + ' min ' + String(r).padStart(2, '0');
    return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0');
  };
  const fmtOff = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtDate = d => new Date(d).toLocaleString(locale(), { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const sum = a => a.reduce((x, y) => x + (y || 0), 0);
  const countBy = (arr, f) => { const m = new Map(); arr.forEach(x => { const k = f(x); if (k == null || k === '') return; m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };
  const toast = msg => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); };

  // ---------- Tooltip ----------
  const tip = $('#tip');
  document.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.style.opacity = 0; return; }
    tip.textContent = el.dataset.tip; tip.style.opacity = 1;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });

  function bars(el, rows, opts = {}) {
    if (!rows.length) { el.innerHTML = `<div class="empty">${T('noData')}</div>`; return; }
    const max = opts.max || Math.max(...rows.map(r => r.value), 1);
    el.innerHTML = rows.map(r => `<div class="bar" data-tip="${esc(r.tip || (r.label + ' : ' + r.text))}">
      <span class="lbl">${esc(r.label)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(0.5, 100 * r.value / max)}%"></span></span>
      <span class="val">${r.html || esc(r.text)}</span></div>`).join('');
  }
  const distBars = (el, entries, total) => bars(el, entries.slice(0, 8).map(([k, n]) => ({ label: k, value: n, text: n + '', html: `${n} <small>${pc(pct(n, total))}</small>`, tip: `${k}: ${n} (${pc(pct(n, total))})` })));

  // ---------- Accès Supabase ----------
  const hashKey = new URLSearchParams(location.hash.slice(1)).get('k');
  let KEY = hashKey || (() => { try { return sessionStorage.getItem('insights_k'); } catch (_) { return null; } })();

  async function rpc(fn, body) {
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (r.status === 401 || r.status === 403) throw new Error('forbidden');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  $('#gateForm').addEventListener('submit', e => { e.preventDefault(); KEY = $('#gateKey').value.trim(); load(); });

  let RAW = [], EXCLUDED = new Set(), periodDays = 0, selectedPerson = null, selectedSession = null;
  const selPeople = new Set(), selExcluded = new Set();
  let lastErr = null;

  async function load() {
    applyStatic();
    if (!KEY) { $('#gate').hidden = false; return; }
    try {
      const [events, excluded] = await Promise.all([rpc('insights_events', { p_key: KEY }), rpc('insights_excluded', { p_key: KEY })]);
      RAW = events; EXCLUDED = new Set(excluded); lastErr = null;
      try { sessionStorage.setItem('insights_k', KEY); } catch (_) {}
      $('#gate').hidden = true; $('#app').hidden = false;
      $('#stamp').dataset.t = Date.now();
      render();
    } catch (err) {
      lastErr = err;
      $('#app').hidden = true; $('#gate').hidden = false;
      $('#gateErr').textContent = err.message === 'forbidden' ? T('gate.bad') : T('gate.fail', err.message);
    }
  }

  async function setExcluded(keys, excluded) {
    if (!keys.length) return;
    const before = new Set(EXCLUDED);
    keys.forEach(k => excluded ? EXCLUDED.add(k) : EXCLUDED.delete(k));
    selPeople.clear(); selExcluded.clear();
    if (excluded && keys.includes(selectedPerson)) selectedPerson = null;
    render();
    try {
      let last = null;
      for (const k of keys) last = await rpc('insights_set_excluded', { p_key: KEY, p_person: k, p_excluded: excluded });
      if (last) EXCLUDED = new Set(last);
      toast(T(excluded ? 'toast.excluded' : 'toast.included', keys.length));
      render();
    } catch (err) {
      EXCLUDED = before; render(); toast(T('toast.err', err.message));
    }
  }

  // ---------- Modèle : sessions & personnes ----------
  function buildModel(events) {
    const bySession = new Map();
    events.forEach(e => { if (!bySession.has(e.s)) bySession.set(e.s, []); bySession.get(e.s).push(e); });
    const visitorEmail = new Map(), visitorTag = new Map();
    events.forEach(e => {
      if (e.t === 'form_submit' && e.x && e.x.email) visitorEmail.set(e.v, e.x);
      if (e.f) visitorTag.set(e.v, e.f);
    });

    const sessions = [...bySession.entries()].map(([id, evs]) => {
      evs.sort((a, b) => new Date(a.ct || a.at) - new Date(b.ct || b.at) || a.id - b.id);
      const start = evs.find(e => e.t === 'session_start');
      const form = [...evs].reverse().find(e => e.t === 'form_submit');
      const t0 = new Date(evs[0].ct || evs[0].at).getTime();
      const tEnd = new Date(evs[evs.length - 1].ct || evs[evs.length - 1].at).getTime();
      const time = evs.filter(e => e.t === 'time');
      const byArea = {};
      time.forEach(e => { const k = (e.x && e.x.kind) + '|' + e.p + '|' + e.g; byArea[k] = (byArea[k] || 0) + (e.d || 0); });
      const areaMs = (kind, page, a) => byArea[kind + '|' + page + '|' + a] || 0;
      const tourSteps = evs.filter(e => e.t === 'tour_step').map(e => e.x.step);
      const v = evs[0].v;
      const s = {
        id, v, evs, t0, tEnd,
        tag: evs.find(e => e.f)?.f || visitorTag.get(v) || null,
        form: form ? form.x : null,
        knownForm: form ? form.x : visitorEmail.get(v) || null,
        start: start ? start.x : {},
        active: sum(time.filter(e => e.x && e.x.kind === 'page').map(e => e.d)),
        landing: areaMs('page', 'landing', 'landing'),
        dash: areaMs('page', 'dashboard', 'dashboard'),
        byArea, areaMs,
        clicks: evs.filter(e => e.t === 'click').length,
        scrollLanding: Math.max(0, ...evs.filter(e => e.t === 'scroll_depth' && e.p === 'landing').map(e => e.x.depth)),
        scrollDash: Math.max(0, ...evs.filter(e => e.t === 'scroll_depth' && e.p === 'dashboard').map(e => e.x.depth)),
        openedForm: evs.some(e => e.t === 'modal_open' && e.g === 'access_form'),
        submitted: !!form,
        reachedDash: evs.some(e => e.t === 'page_view' && e.p === 'dashboard'),
        maxStep: tourSteps.length ? Math.max(...tourSteps) : 0,
        tourDone: evs.some(e => e.t === 'tour_complete'),
        tourSkip: evs.find(e => e.t === 'tour_skip')?.x?.step || null,
        assistant: evs.filter(e => e.t === 'click' && e.x && e.x.area === 'tourAssistant').map(e => cleanTarget(e.g)),
        consent: evs.some(e => e.t === 'consent_toggle' && e.x && e.x.checked),
        dpa: evs.some(e => e.t === 'modal_open' && e.g === 'dpa'),
        addData: evs.some(e => e.t === 'add_data_click'),
        formAbandon: evs.some(e => e.t === 'form_abandon'),
      };
      // Clé stable d'une personne : lien perso > email > navigateur.
      s.person = s.tag || (s.knownForm && s.knownForm.email) || ('anon-' + v.slice(0, 6));
      return s;
    });

    const people = new Map();
    sessions.forEach(s => { if (!people.has(s.person)) people.set(s.person, []); people.get(s.person).push(s); });
    const persons = [...people.entries()].map(([key, ss]) => personOf(key, ss));
    return { sessions, persons };
  }

  function personOf(key, ss) {
    ss.sort((a, b) => a.t0 - b.t0);
    const f = ss.map(s => s.knownForm).find(Boolean) || {};
    const any = k => ss.some(s => s[k]);
    const p = {
      key, sessions: ss, tag: ss.find(s => s.tag)?.tag || null,
      email: f.email || null, company: f.company || null, role: f.role || null, raise: f.last_raise || null,
      first: ss[0].t0, last: Math.max(...ss.map(s => s.tEnd)),
      active: sum(ss.map(s => s.active)), clicks: sum(ss.map(s => s.clicks)),
      submitted: any('submitted'), tourDone: any('tourDone'), consent: any('consent'), dpa: any('dpa'), addData: any('addData'),
      assistant: ss.some(s => s.assistant.length), maxStep: Math.max(...ss.map(s => s.maxStep)),
      device: ss[0].start.device || '—', excluded: EXCLUDED.has(key),
    };
    p.score = (p.submitted ? 2 : 0) + (p.consent ? 2 : 0) + (p.dpa ? 1 : 0) + (p.addData ? 2 : 0) + (p.tourDone ? 1 : 0)
      + (p.assistant ? 1 : 0) + (ss.length > 1 ? 1 : 0) + (p.active >= 180000 ? 1 : 0);
    return p;
  }
  const byScore = (a, b) => b.score - a.score || b.last - a.last;
  const personName = p => p.tag || p.email || T('anon');

  // ---------- Rendu ----------
  let MODEL = null;
  function filtered() {
    const since = periodDays ? Date.now() - periodDays * 864e5 : 0;
    const m = buildModel(RAW);
    const inPeriod = s => s.tEnd >= since;
    const all = m.persons.map(p => ({ ...p, sessions: p.sessions.filter(inPeriod) })).filter(p => p.sessions.length)
      .map(p => personOf(p.key, p.sessions)).sort(byScore);
    const persons = all.filter(p => !p.excluded);
    const excludedPersons = m.persons.filter(p => p.excluded).sort(byScore);
    const sessions = persons.flatMap(p => p.sessions);
    return { sessions, persons, excludedPersons };
  }

  function render() {
    applyStatic();
    if ($('#stamp').dataset.t) $('#stamp').textContent = T('updated', new Date(+$('#stamp').dataset.t).toLocaleTimeString(locale(), { hour:'2-digit', minute:'2-digit' }));
    MODEL = filtered();
    const { sessions: S, persons: P } = MODEL;
    const n = S.length;

    // KPIs
    const med = median(S.map(s => s.active).filter(x => x > 0));
    const k = (label, v, sub, tipTxt) => `<div class="card kpi" data-tip="${esc(tipTxt || label)}"><div class="k">${label}</div><div class="v">${v}</div><div class="s">${sub || ''}</div></div>`;
    const dashS = S.filter(s => s.reachedDash);
    $('#kpis').innerHTML = [
      k(T('k.people'), P.length, T('k.peopleSub', P.filter(p => p.sessions.length > 1).length)),
      k(T('k.sessions'), n, T('k.sessionsSub', S.filter(s => s.tag).length)),
      k(T('k.active'), fmtDur(med), T('k.activeSub', fmtDur(sum(S.map(s => s.active)))), T('k.activeTip')),
      k(T('k.form'), pc(pct(S.filter(s => s.submitted).length, n)), T('k.formSub', S.filter(s => s.submitted).length, n)),
      k(T('k.tour'), pc(pct(dashS.filter(s => s.tourDone).length, dashS.length)), T('k.tourSub', dashS.length)),
      k(T('k.add'), pc(pct(S.filter(s => s.addData).length, n)), T('k.addSub', P.filter(p => p.addData).length), T('k.addTip')),
    ].join('');

    // Entonnoir
    const steps = [
      [T('f.visit'), S.length],
      [T('f.scroll'), S.filter(s => s.scrollLanding >= 50).length],
      [T('f.open'), S.filter(s => s.openedForm).length],
      [T('f.submit'), S.filter(s => s.submitted || s.reachedDash).length],
      [T('f.tour'), S.filter(s => s.tourDone).length],
      [T('f.asst'), S.filter(s => s.assistant.length).length],
      [T('f.consent'), S.filter(s => s.consent).length],
      [T('f.add'), S.filter(s => s.addData).length],
    ];
    bars($('#funnel'), steps.map(([l, c], i) => {
      const prev = i ? steps[i - 1][1] : c;
      const drop = i && prev ? 100 - pct(c, prev) : 0;
      return { label: l, value: c, html: `${c} <small>${pc(pct(c, n))}</small>${drop > 0 ? `<span class="drop">−${pc(drop)}</span>` : ''}`,
        tip: T('f.tip', l, c, pct(c, n)) + (i ? T('f.tipDrop', drop) : '') };
    }), { max: Math.max(n, 1) });

    // Temps par zone
    function areaRows(page, list) {
      return list.map(a => {
        const seen = S.filter(s => s.areaMs('section', page, a) > 0);
        const avg = seen.length ? sum(seen.map(s => s.areaMs('section', page, a))) / seen.length : 0;
        return { label: area(a), value: avg, html: `${fmtDur(avg)} <small>${pc(pct(seen.length, page === 'landing' ? n : dashS.length))}</small>`,
          tip: T('a.tip', area(a), fmtDur(avg), seen.length) };
      });
    }
    bars($('#landingTime'), areaRows('landing', ['hero', 'problem', 'evidence', 'how', 'product', 'security', 'access', 'footer']));
    bars($('#dashTime'), areaRows('dashboard', ['tourOverview', 'cashPanel', 'tourAssumptions', 'tourAssistant', 'scenarioPanel', 'tourData']));
    const titles = get('tourTitles');
    bars($('#tour'), [1, 2, 3, 4].map(i => {
      const reached = dashS.filter(s => s.maxStep >= i);
      const t = reached.length ? sum(reached.map(s => s.areaMs('tour_step', 'dashboard', 'step_' + i))) / reached.length : 0;
      return { label: `${i}. ${titles[i]}`, value: reached.length,
        html: `${pc(pct(reached.length, dashS.length))} <small>${fmtDur(t)}</small>`,
        tip: T('tour.step', i, reached.length, dashS.length, fmtDur(t), dashS.filter(s => s.tourSkip === i).length) };
    }).concat([{ label: T('tour.done'), value: dashS.filter(s => s.tourDone).length, html: pc(pct(dashS.filter(s => s.tourDone).length, dashS.length)), tip: T('tour.doneTip') }]),
    { max: Math.max(dashS.length, 1) });
    bars($('#scroll'), [25, 50, 75, 100].map(d => ({ label: T('sc.landing', d), value: S.filter(s => s.scrollLanding >= d).length, html: pc(pct(S.filter(s => s.scrollLanding >= d).length, n)) }))
      .concat([25, 50, 75, 100].map(d => ({ label: T('sc.dash', d), value: dashS.filter(s => s.scrollDash >= d).length, html: pc(pct(dashS.filter(s => s.scrollDash >= d).length, dashS.length)) }))),
    { max: Math.max(n, 1) });

    // Clics
    const th = get('th');
    const allE = S.flatMap(s => s.evs);
    const clickAgg = new Map();
    allE.filter(e => e.t === 'click').forEach(e => {
      const key = e.p + '|' + (e.x?.area || '') + '|' + cleanTarget(e.g);
      const c = clickAgg.get(key) || { page: e.p, area: e.x?.area, label: cleanTarget(e.g), n: 0, s: new Set() };
      c.n++; c.s.add(e.s); clickAgg.set(key, c);
    });
    const clickRows = [...clickAgg.values()].sort((a, b) => b.s.size - a.s.size || b.n - a.n);
    $('#clicks').innerHTML = clickRows.length ? `<tr><th>${th.el}</th><th>${th.zone}</th><th class="n">${th.clicks}</th><th class="n">${th.sessions}</th></tr>` +
      clickRows.slice(0, 25).map(c => `<tr><td>${esc(c.label)}</td><td class="muted">${esc(T(c.page === 'landing' ? 'landing' : 'dashboard'))} · ${esc(area(c.area))}</td><td class="n">${c.n}</td><td class="n">${c.s.size} <small>${pc(pct(c.s.size, n))}</small></td></tr>`).join('')
      : `<tr><td class="empty">${T('noClicks')}</td></tr>`;

    const FR_LABEL = get('fr');
    const fr = new Map();
    allE.filter(e => FR_LABEL[e.t]).forEach(e => {
      const key = e.t + '|' + (e.x?.area || '') + '|' + e.g;
      const c = fr.get(key) || { t: e.t, area: e.x?.area, label: cleanTarget(e.g), n: 0, s: new Set() };
      c.n++; c.s.add(e.s); fr.set(key, c);
    });
    const frRows = [...fr.values()].sort((a, b) => b.n - a.n);
    $('#friction').innerHTML = frRows.length ? `<tr><th>${th.type}</th><th>${th.where}</th><th class="n">${th.times}</th><th class="n">${th.sessions}</th></tr>` +
      frRows.slice(0, 20).map(c => `<tr><td><span class="badge ${c.t === 'rage_click' ? 'b-bad' : 'b-warn'}">${FR_LABEL[c.t]}</span></td><td>${esc(area(c.area))} <small>${esc(c.label)}</small></td><td class="n">${c.n}</td><td class="n">${c.s.size}</td></tr>`).join('')
      : `<tr><td class="empty">${T('noFriction')}</td></tr>`;

    // Formulaire & audience
    const opens = allE.filter(e => e.t === 'modal_open' && e.g === 'access_form');
    distBars($('#ctaSrc'), countBy(opens, e => area(e.x?.source)), opens.length);
    const forms = S.filter(s => s.form).map(s => s.form);
    distBars($('#roles'), countBy(forms, f => f.role), forms.length);
    distBars($('#raises'), countBy(forms, f => f.last_raise), forms.length);
    const opened = S.filter(s => s.openedForm);
    const fld = get('fld');
    const fieldRows = ['email', 'company', 'role', 'raise'].map(f => {
      const c = opened.filter(s => s.evs.some(e => e.t === 'field_change' && e.g === f)).length;
      return { label: fld[f], value: c, html: pc(pct(c, opened.length)), tip: `${c} / ${opened.length}` };
    });
    const inval = opened.filter(s => s.evs.some(e => e.t === 'form_invalid')).length;
    const aband = opened.filter(s => s.formAbandon).length;
    fieldRows.push({ label: fld.invalid, value: inval, html: pc(pct(inval, opened.length)), tip: `${inval} / ${opened.length}` });
    fieldRows.push({ label: fld.abandon, value: aband, html: pc(pct(aband, opened.length)), tip: T('fld.abandonTip', aband) });
    bars($('#fields'), opened.length ? fieldRows : [], { max: Math.max(opened.length, 1) });
    distBars($('#devices'), countBy(S, s => s.start.device), n);
    distBars($('#refs'), countBy(S, s => { const r = s.start.referrer; if (!r) return T('direct'); try { return new URL(r).hostname; } catch (_) { return r; } }), n);

    renderPeople(P);
    renderExcluded(MODEL.excludedPersons);
    renderInsights(S, P, { steps, frRows, dashS, opened, aband });
    if (selectedPerson && P.some(p => p.key === selectedPerson)) renderJourney(selectedPerson);
    else { selectedPerson = null; $('#journeyCard').innerHTML = `<div class="empty">${T('journey.pick')}</div>`; }
  }

  function badges(p) {
    const b = [], L = get('b');
    if (p.submitted) b.push(`<span class="badge b-info">${L.form}</span>`);
    if (p.tourDone) b.push(`<span class="badge b-info">${L.tour}</span>`);
    else if (p.maxStep) b.push(`<span class="badge b-mute">${fill(L.tourN, [p.maxStep])}</span>`);
    if (p.assistant) b.push(`<span class="badge b-info">${L.asst}</span>`);
    if (p.consent) b.push(`<span class="badge b-good">${L.consent}</span>`);
    if (p.dpa) b.push(`<span class="badge b-good">${L.dpa}</span>`);
    if (p.addData) b.push(`<span class="badge b-good">${L.add}</span>`);
    if (p.sessions.length > 1) b.push(`<span class="badge b-warn">${fill(L.visits, [p.sessions.length])}</span>`);
    if (p.excluded) b.push(`<span class="badge b-mute">${L.excluded}</span>`);
    return b.join('');
  }

  function personRow(p, sel) {
    return `<td class="cb"><input type="checkbox" data-cb="${esc(p.key)}" ${sel.has(p.key) ? 'checked' : ''} aria-label="${esc(personName(p))}"></td>
      <td><b>${esc(personName(p))}</b>${p.tag && p.email ? `<br><small>${esc(p.email)}</small>` : !p.tag && !p.email ? `<br><small>${esc(p.key)} · ${esc(p.device)}</small>` : ''}</td>
      <td>${esc(p.company || '—')}${p.role ? `<br><small>${esc(p.role)} · ${esc(T('raise', p.raise || '?'))}</small>` : ''}</td>
      <td><span class="score">${p.score}<i><b style="width:${p.score / 9 * 100}%"></b></i></span></td>
      <td class="n">${fmtDur(p.active)}</td><td class="n">${p.clicks}</td>
      <td>${badges(p)}</td><td class="muted">${fmtDate(p.last)}</td>`;
  }
  function headRow(id) {
    const th = get('th');
    return `<tr><th class="cb"><input type="checkbox" data-all="${id}" aria-label="all"></th><th>${th.person}</th><th>${th.company}</th><th>${th.score}</th><th class="n">${th.active}</th><th class="n">${th.clicks}</th><th>${th.signals}</th><th>${th.last}</th></tr>`;
  }
  function wireSelection(table, list, sel, btn, labelKey) {
    const update = () => { btn.textContent = T(labelKey, sel.size); btn.disabled = !sel.size; };
    table.querySelectorAll('input[data-cb]').forEach(cb => {
      cb.addEventListener('click', e => e.stopPropagation());
      cb.addEventListener('change', () => { cb.checked ? sel.add(cb.dataset.cb) : sel.delete(cb.dataset.cb); update(); });
    });
    const all = table.querySelector('input[data-all]');
    if (all) {
      all.checked = list.length > 0 && list.every(p => sel.has(p.key));
      all.addEventListener('change', () => {
        list.forEach(p => all.checked ? sel.add(p.key) : sel.delete(p.key));
        table.querySelectorAll('input[data-cb]').forEach(cb => { cb.checked = all.checked; });
        update();
      });
    }
    [...sel].forEach(k => { if (!list.some(p => p.key === k)) sel.delete(k); });
    update();
  }

  function renderPeople(P) {
    const t = $('#people');
    t.innerHTML = P.length ? headRow('people') + P.map(p => `<tr class="row ${p.key === selectedPerson ? 'sel' : ''}" data-person="${esc(p.key)}">${personRow(p, selPeople)}</tr>`).join('')
      : `<tr><td class="empty">${T('noPeople')}</td></tr>`;
    t.querySelectorAll('tr.row').forEach(tr => tr.addEventListener('click', () => {
      selectedPerson = tr.dataset.person; selectedSession = null;
      t.querySelectorAll('tr.row').forEach(r => r.classList.toggle('sel', r === tr));
      renderJourney(selectedPerson);
      $('#journeyAnchor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
    wireSelection(t, P, selPeople, $('#excludeSel'), 'excludeSel');
  }

  function renderExcluded(X) {
    const t = $('#excluded');
    t.innerHTML = X.length ? headRow('excluded') + X.map(p => `<tr class="excluded">${personRow(p, selExcluded)}</tr>`).join('')
      : `<tr><td class="empty">${T('excl.none')}</td></tr>`;
    wireSelection(t, X, selExcluded, $('#includeSel'), 'includeSel');
  }

  $('#excludeSel').addEventListener('click', () => setExcluded([...selPeople], true));
  $('#includeSel').addEventListener('click', () => setExcluded([...selExcluded], false));

  // ---------- Parcours d'une personne ----------
  function describe(e) {
    const x = e.x || {}, E = get('ev');
    switch (e.t) {
      case 'session_start': return [fill(E.session_start[0], [x.referrer ? fill(E.session_start[1], [esc(x.referrer)]) : '']), `${esc(x.device || '')} ${esc(x.viewport || '')} · ${esc(x.lang || '')} · ${esc(x.tz || '')}${x.returning ? fill(E.returning, [x.visit_number]) : ''}`, 'key'];
      case 'page_view': return [fill(E.page_view, [e.p === 'dashboard' ? E.pv_dash : E.pv_land]), '', 'key'];
      case 'page_reload': return [E.page_reload, '', ''];
      case 'click': return [fill(E.click, [esc(cleanTarget(e.g))]), esc(area(x.area)) + (x.nav_to ? ' → ' + esc(area(x.nav_to)) : '') + (x.scroll_to ? ' → ' + esc(area(x.scroll_to)) : ''), x.area === 'tourAssistant' || x.cta ? 'key' : ''];
      case 'dead_click': return [E.dead_click, esc(area(x.area)) + ' · ' + esc(e.g), 'warn'];
      case 'rage_click': return [fill(E.rage_click, [esc(cleanTarget(e.g))]), esc(area(x.area)), 'bad'];
      case 'disabled_click': return [E.disabled_click, '', 'warn'];
      case 'scroll_depth': return [fill(E.scroll, [esc(e.g), e.p === 'dashboard' ? E.of_dash : E.of_land]), '', ''];
      case 'modal_open': return [fill(E.modal_open, [esc(area(e.g))]), x.source ? fill(E.from, [esc(area(x.source))]) : '', 'key'];
      case 'modal_close': return [fill(E.modal_close, [esc(area(e.g))]), fill(E.after, [fmtDur(e.d)]), ''];
      case 'field_focus': return [fill(E.field_focus, [esc(e.g)]), '', ''];
      case 'field_change': return [fill(E.field_change, [esc(e.g)]), x.value ? esc(x.value) : '', ''];
      case 'form_invalid': return [fill(E.form_invalid, [esc(e.g)]), '', 'warn'];
      case 'form_abandon': return [fill(E.form_abandon, [esc((x.fields_filled || []).join(', '))]), '', 'bad'];
      case 'form_submit': return [E.form_submit, `${esc(x.email)} · ${esc(x.company)} · ${esc(x.role)} · ${esc(T('raise', x.last_raise))}`, 'good'];
      case 'tour_step': return [fill(E.tour_step, [x.step]), esc(get('tourTitles')[x.step] || x.title || ''), ''];
      case 'tour_complete': return [E.tour_complete, '', 'good'];
      case 'tour_skip': return [fill(E.tour_skip, [x.step]), '', 'bad'];
      case 'tour_restart': return [E.tour_restart, '', 'key'];
      case 'consent_toggle': return [x.checked ? E.consent_on : E.consent_off, '', x.checked ? 'good' : 'warn'];
      case 'add_data_click': return [E.add_data, E.add_data_sub, 'good'];
      case 'copy_text': return [E.copy_text, '“' + esc(e.g) + '”', 'key'];
      case 'idle': return [E.idle, '', ''];
      case 'tab_hidden': return [E.tab_hidden, '', ''];
      case 'tab_visible': return [E.tab_visible, '', ''];
      case 'page_leave': return [E.page_leave, '', 'bad'];
      default: return [esc(e.t), esc(e.g || ''), ''];
    }
  }

  function renderJourney(key) {
    const p = MODEL.persons.find(x => x.key === key);
    const card = $('#journeyCard'), J = get('j');
    if (!p) { card.innerHTML = `<div class="empty">${T('journey.gone')}</div>`; return; }
    if (!selectedSession || !p.sessions.some(s => s.id === selectedSession)) selectedSession = p.sessions[p.sessions.length - 1].id;
    const s = p.sessions.find(x => x.id === selectedSession);

    const list = p.sessions.map((x, i) => `<div class="sess ${x.id === s.id ? 'sel' : ''}" data-s="${x.id}">
      <div class="t"><span>${fill(J.session, [i + 1])}</span><small>${fmtDate(x.t0)}</small></div>
      <small>${fill(J.sessSub, [fmtDur(x.active), x.clicks, x.reachedDash ? J.dash : J.landOnly])}</small></div>`).join('');

    const zones = Object.entries(s.byArea).map(([k, ms]) => { const [kind, page, a] = k.split('|'); return { kind, page, a, ms }; })
      .filter(z => z.kind !== 'page').sort((a, b) => b.ms - a.ms);

    let lastPage = null;
    const items = s.evs.filter(e => e.t !== 'time').map(e => {
      const off = new Date(e.ct || e.at).getTime() - s.t0;
      const [title, sub, cls] = describe(e);
      let sep = '';
      if (e.t === 'page_view' && e.p !== lastPage) { sep = `<div class="tl-page">${T(e.p === 'dashboard' ? 'dashboard' : 'landing')}</div>`; lastPage = e.p; }
      return `${sep}<div class="tl-item ${cls ? 'k-' + cls : ''}"><span class="tl-time">+${fmtOff(off)}</span><span class="tl-dot"></span><span class="tl-body">${title}${sub ? `<small>${sub}</small>` : ''}</span></div>`;
    }).join('');

    card.innerHTML = `
      <div class="card-h"><div><h2>${esc(p.tag || p.email || T('anonVisitor'))}</h2>
        <small>${esc([p.company, p.role, p.raise && T('raise', p.raise), p.email && p.tag ? p.email : null].filter(Boolean).join(' · ') || p.key)}</small></div>
        <div class="pill-row">${badges(p)}<button class="btn danger" id="excludeOne" style="padding:3px 10px;font-size:12px">${T('excludeOne')}</button></div></div>
      <div class="journey">
        <div><h3 style="margin-bottom:8px">${fill(J.sessions, [p.sessions.length])}</h3><div class="sess-list">${list}</div></div>
        <div>
          <div class="kv">
            <div><b>${fmtDur(s.active)}</b><span>${J.active}</span></div>
            <div><b>${fmtDur(s.tEnd - s.t0)}</b><span>${J.total}</span></div>
            <div><b>${fmtDur(s.landing)}</b><span>${J.onLanding}</span></div>
            <div><b>${fmtDur(s.dash)}</b><span>${J.onDash}</span></div>
            <div><b>${s.maxStep}/4</b><span>${J.steps}</span></div>
            <div><b>${s.clicks}</b><span>${J.clicks}</span></div>
          </div>
          <h3 style="margin:4px 0 8px">${J.attention}</h3>
          <div class="bars" id="sessZones"></div>
          <h3 style="margin:18px 0 4px">${J.timeline}</h3>
          <div class="timeline">${items}</div>
        </div>
      </div>`;
    bars($('#sessZones'), zones.slice(0, 12).map(z => ({ label: area(z.a) + (z.kind === 'modal' ? J.modal : ''), value: z.ms, text: fmtDur(z.ms) })));
    card.querySelectorAll('.sess').forEach(el => el.addEventListener('click', () => { selectedSession = el.dataset.s; renderJourney(key); }));
    $('#excludeOne').addEventListener('click', () => setExcluded([p.key], true));
  }

  // ---------- Insights automatiques ----------
  function renderInsights(S, P, ctx) {
    const out = [], I = get('ins');
    const add = (cls, icon, html) => out.push(`<div class="ins ${cls}"><span class="ic">${icon}</span><div>${html}</div></div>`);
    const n = S.length;
    if (!n) { $('#insights').innerHTML = `<div class="empty">${T('noSessions')}</div>`; return; }

    add('info', 'n', fill(I.count, [n, P.length]) + (n < 10 ? I.small : ''));

    let worst = null;
    ctx.steps.forEach(([l, c], i) => { if (!i) return; const prev = ctx.steps[i - 1][1]; if (prev >= 1) { const loss = prev - c; if (!worst || loss / prev > worst.r) worst = { from: ctx.steps[i - 1][0], to: l, r: loss / prev, loss }; } });
    if (worst && worst.loss > 0) add('bad', '↓', fill(I.drop, [esc(worst.from), esc(worst.to), Math.round(worst.r * 100), worst.loss]));

    const secs = ['hero', 'problem', 'evidence', 'how', 'product', 'security', 'access'].map(a => {
      const seen = S.filter(s => s.areaMs('section', 'landing', a) > 0);
      return { a, reach: seen.length / n, avg: seen.length ? sum(seen.map(s => s.areaMs('section', 'landing', a))) / seen.length : 0 };
    });
    const top = [...secs].sort((x, y) => y.avg - x.avg)[0];
    if (top && top.avg > 0) add('info', '◎', fill(I.topSection, [esc(area(top.a)), fmtDur(top.avg)]));
    const low = secs.filter(x => x.reach < 0.5 && x.a !== 'hero');
    if (low.length) add('warn', '!', fill(I.lowReach, [low.map(x => `<b>${esc(area(x.a))}</b> (${pc(Math.round(x.reach * 100))})`).join(', ')]));

    const toForm = S.filter(s => s.submitted).map(s => new Date(s.evs.find(e => e.t === 'form_submit').ct).getTime() - s.t0);
    if (toForm.length) add('info', '⏱', fill(I.toForm, [fmtDur(median(toForm))]));

    if (ctx.dashS.length) {
      const done = ctx.dashS.filter(s => s.tourDone).length;
      const skips = countBy(ctx.dashS.filter(s => s.tourSkip), s => s.tourSkip);
      add(done / ctx.dashS.length >= 0.6 ? 'good' : 'warn', '▶', fill(I.tour, [pct(done, ctx.dashS.length)]) + (skips.length ? fill(I.tourSkip, [skips[0][0], skips[0][1]]) : ''));
    }

    const asst = countBy(S.flatMap(s => s.assistant.map(a => ({ a }))), x => x.a);
    if (asst.length) add('good', '★', fill(I.asst, [esc(asst[0][0]), asst[0][1]]));

    const cons = S.filter(s => s.consent).length, addD = S.filter(s => s.addData).length, dpaN = S.filter(s => s.dpa).length;
    if (ctx.dashS.length) add(addD ? 'good' : 'warn', '⬆', fill(I.data, [cons, addD, pct(addD, ctx.dashS.length), dpaN]));

    const dis = ctx.frRows.filter(r => r.t === 'disabled_click').reduce((a, r) => a + r.s.size, 0);
    if (dis) add('warn', '⚠', fill(I.disabled, [dis]));
    const dead = ctx.frRows.filter(r => r.t === 'dead_click')[0];
    if (dead) add('warn', '?', fill(I.dead, [esc(area(dead.area)) + (dead.label ? ' · ' + esc(dead.label) : ''), dead.n]));
    const rage = ctx.frRows.filter(r => r.t === 'rage_click')[0];
    if (rage) add('bad', '✕', fill(I.rage, [esc(rage.label), esc(area(rage.area))]));
    if (ctx.opened.length && ctx.aband) add('bad', '✎', fill(I.abandon, [ctx.aband, ctx.opened.length]));

    const back = P.filter(p => p.sessions.length > 1);
    if (back.length) add('good', '↺', fill(I.back, [back.length, back.slice(0, 5).map(p => esc(personName(p))).join(', ')]));
    const hot = P.filter(p => p.score >= 6);
    if (hot.length) add('good', '♥', fill(I.hot, [hot.slice(0, 6).map(p => `<b>${esc(personName(p))}</b> (${p.score})`).join(', ')]));

    $('#insights').innerHTML = out.join('');
  }

  // ---------- Contrôles ----------
  $('#period').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    periodDays = +b.dataset.p;
    document.querySelectorAll('#period button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  $('#lang').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    LANG = b.dataset.l;
    try { localStorage.setItem('insights_lang', LANG); } catch (_) {}
    if ($('#app').hidden) { applyStatic(); if (lastErr) $('#gateErr').textContent = lastErr.message === 'forbidden' ? T('gate.bad') : T('gate.fail', lastErr.message); }
    else render();
  });
  $('#refresh').addEventListener('click', load);
  $('#csv').addEventListener('click', () => {
    const cols = ['created_at', 'founder_tag', 'session_id', 'visitor_id', 'event_type', 'page', 'target', 'duration_ms', 'props'];
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const keep = new Set(MODEL.sessions.map(s => s.id));
    const rows = RAW.filter(e => keep.has(e.s)).map(e => [e.ct || e.at, e.f, e.s, e.v, e.t, e.p, e.g, e.d, JSON.stringify(e.x)].map(q).join(','));
    const blob = new Blob([cols.join(',') + '\n' + rows.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bearing-events.csv'; a.click();
  });
  setInterval(() => { if (!$('#app').hidden && document.visibilityState === 'visible' && !selPeople.size && !selExcluded.size) load(); }, 60000);

  load();
})();
</script>
</body>
</html>
